#unbind C-b
set -g prefix C-q
bind C-a send-prefix
bind q copy-mode
bind C-q paste-buffer
set-option -g mouse on
set-option -g set-clipboard external
#bind-key -t vi-copy MouseDragEnd1Pane copy-pipe "xclip -in -selection clipboard"
#bind-key MouseDragEnd1Pane copy-pipe "xclip -in -selection clipboard"
# Emacs style (https://wiki.archlinux.org/index.php/tmux#Copy_Mode)
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"
bind-key C-y run "xsel -o | tmux load-buffer - ; tmux paste-buffer"
bind-key MouseDragEnd1Pane send-keys copy-pipe-and-cancel "xsel -i -p && xsel -o -p | xsel -i -b"

set -g pane-border-lines "heavy"
# Style for the active pane border
set -g pane-active-border-style "fg=magenta,bg=default"
# Style for inactive pane borders
set -g pane-border-style "fg=brightblack,bg=default"


#set -w -g window-style 'fg=colour247,bg=colour236'
#set -w -g window-active-style 'fg=default,bg=default'