#unbind C-b
set -g prefix C-q
bind C-a send-prefix
bind q copy-mode
bind C-q paste-buffer -p
set-option -g mouse on

# Copy through the terminal (OSC 52); Foot writes to the Wayland clipboard.
# Do not also pipe to xsel/wl-copy: competing clipboard writers can conflict.
set-option -s set-clipboard external
bind-key -T copy-mode y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-selection-and-cancel
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-and-cancel

# Remove obsolete prefix bindings when reloading an existing tmux server.
unbind-key -q MouseDragEnd1Pane
unbind-key -q C-y
# Paste the desktop clipboard with Foot's Ctrl+Shift+V.
# Prefix + Ctrl+Q pastes tmux's own buffer (with bracketed paste when supported).

set -g pane-border-lines "heavy"
# Style for the active pane border
set -g pane-active-border-style "fg=magenta,bg=default"
# Solarized base00; brightblack matches foot's Solarized Dark background.
set -g pane-border-style "fg=#657b83,bg=default"


