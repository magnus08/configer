[main]
include=/usr/share/foot/themes/solarized-dark
font=Fira Code:size=12

[bell]
# Don't ring the system bell (foot >= 1.20 defaults to system=yes); flash instead.
system=no
visual=yes

[colors-dark]
# Backup filenames use bright black (LS_COLORS *~=00;90).
# Solarized's default matches the background; use base0 for readable text.
bright0=839496

title=🤖 aa

